<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>租户端 · 模块总览（高保真 · 单屏）</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&display=swap");

  :root {
    --bg: #eef1f6;
    --panel: #ffffff;
    --ink: #1d2129;
    --ink-2: #4e5969;
    --muted: #86909c;
    --line: rgba(15, 23, 42, 0.08);
    --accent: #3f7cff;
    --accent-soft: color-mix(in srgb, var(--accent) 12%, #fff);
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.06);
    --radius: 12px;
    --sidebar-w: 176px;
    --bar-h: 40px;
    --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    --font-display: "DM Sans", var(--font);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }

  /* 顶栏 */
  .proto-bar {
    height: var(--bar-h);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    background: #0f172a;
    color: #cbd5e1;
    font-size: 12px;
  }
  .proto-bar strong {
    font-family: var(--font-display);
    color: #fff;
    font-weight: 700;
  }
  .proto-bar .tag {
    padding: 1px 8px;
    border-radius: 999px;
    background: rgba(63, 124, 255, 0.3);
    color: #bfdbfe;
    font-weight: 600;
  }
  .proto-bar .muted { color: #64748b; flex: 1; }
  .proto-bar .toggle {
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #e2e8f0;
    border-radius: 7px;
    padding: 4px 10px;
    cursor: pointer;
  }
  .proto-bar .toggle[aria-pressed="true"] {
    background: rgba(63, 124, 255, 0.35);
  }

  .layout {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
  }

  /* 侧栏 */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: #0b1220;
    color: #94a3b8;
    padding: 12px 8px;
    overflow-y: auto;
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 8px 12px;
    margin-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .sidebar-logo {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: linear-gradient(135deg, #3f7cff, #7048e8);
    display: grid; place-items: center;
    color: #fff;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 11px;
  }
  .sidebar-brand .name { color: #fff; font-size: 12.5px; font-weight: 600; }
  .sidebar-brand .sub { font-size: 10px; color: #64748b; }
  .sidebar .hint {
    margin: 0 8px 6px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #475569;
  }
  .nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .nav-list button {
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: #94a3b8;
    border-radius: 8px;
    padding: 7px 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
  }
  .nav-list button:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }
  .nav-list button.active {
    background: color-mix(in srgb, var(--accent) 24%, transparent);
    color: #fff;
    font-weight: 600;
  }
  .nav-ico {
    width: 22px; height: 22px;
    border-radius: 6px;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.06);
  }
  .nav-list button.active .nav-ico {
    background: color-mix(in srgb, var(--accent) 55%, #0b1220);
  }
  .nav-ico svg { width: 12px; height: 12px; }

  /* 主画布：严格单屏 */
  .main {
    flex: 1;
    min-width: 0;
    min-height: 0;
    padding: 12px 14px;
    overflow: hidden;
    background:
      radial-gradient(700px 280px at 8% -20%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      var(--bg);
  }

  /* 总览板：填满主区 */
  .board {
    height: 100%;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
    gap: 10px;
    min-height: 0;
  }
  .board.has-workflow {
    grid-template-rows: auto auto auto minmax(0, 1fr);
  }

  /* —— 顶区 Hero —— */
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 220px;
    gap: 14px;
    align-items: stretch;
    padding: 14px 16px;
    border-radius: var(--radius);
    background: linear-gradient(
      118deg,
      color-mix(in srgb, var(--accent) 16%, #fff) 0%,
      color-mix(in srgb, var(--accent) 6%, #fff) 45%,
      #fff 100%
    );
    border: 1px solid color-mix(in srgb, var(--accent) 16%, var(--line));
    box-shadow: var(--shadow-sm);
    min-height: 0;
  }
  .hero-main { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .hero-top {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 10px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, #fff);
    padding: 1px 8px;
    border-radius: 999px;
  }
  .eyebrow svg { width: 12px; height: 12px; }
  .roles { display: flex; flex-wrap: wrap; gap: 5px; }
  .role-chip {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    color: color-mix(in srgb, var(--accent) 70%, #0f172a);
    background: rgba(255,255,255,0.7);
    border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .hero h2 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.2;
  }
  .positioning {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--ink);
  }
  .desc {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .boundary {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: auto;
    padding: 7px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.72);
    border: 1px solid var(--line);
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--ink-2);
  }
  .boundary svg {
    width: 14px; height: 14px;
    flex-shrink: 0;
    margin-top: 1px;
    color: var(--accent);
  }
  .boundary b { color: var(--ink); font-weight: 600; }

  .art {
    border-radius: 10px;
    border: 1.5px dashed color-mix(in srgb, var(--accent) 38%, #cbd5e1);
    background:
      linear-gradient(160deg, color-mix(in srgb, var(--accent) 8%, #fff), #fff 72%),
      repeating-linear-gradient(-45deg, transparent, transparent 7px, color-mix(in srgb, var(--accent) 4%, transparent) 7px, color-mix(in srgb, var(--accent) 4%, transparent) 14px);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 0;
  }
  .art-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .art-title {
    margin: 8px 0 4px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.3;
  }
  .art-brief {
    margin: 0;
    font-size: 11px;
    line-height: 1.4;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* —— 中条：上下游 + 常用操作 —— */
  .strip {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) auto;
    gap: 10px;
    align-items: center;
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    min-height: 0;
  }
  .chain {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
  }
  .chain-label {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    margin-right: 2px;
  }
  .chain-node {
    min-width: 0;
    flex: 1;
    padding: 6px 10px;
    border-radius: 8px;
    background: #f5f7fa;
    border: 1px solid var(--line);
  }
  .chain-node.current {
    background: var(--accent-soft);
    border-color: color-mix(in srgb, var(--accent) 28%, transparent);
  }
  .chain-node .k {
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 1px;
  }
  .chain-node.current .k { color: var(--accent); }
  .chain-node .v {
    font-size: 12px;
    font-weight: 650;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chain-arrow {
    flex-shrink: 0;
    color: #c0c4cc;
    display: grid;
    place-items: center;
  }
  .chain-arrow svg { width: 14px; height: 14px; }

  .actions {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    flex-shrink: 0;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 8px;
    padding: 6px 11px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid rgba(15,23,42,0.12);
    background: #fff;
    color: var(--ink);
    white-space: nowrap;
    box-shadow: var(--shadow-sm);
  }
  .btn.primary {
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, #fff), var(--accent));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 28%, transparent);
  }
  .btn svg { width: 12px; height: 12px; }

  /* —— 工作流（仅运营） —— */
  .workflow-panel {
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  .workflow-panel .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .workflow-panel .head h3 {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .workflow-panel .head h3 .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .workflow-panel .head span { font-size: 11px; color: var(--muted); }
  .workflow {
    display: flex;
    align-items: stretch;
    gap: 2px;
  }
  .step {
    flex: 1;
    min-width: 0;
    text-align: center;
    padding: 6px 4px;
    border-radius: 8px;
    transition: background 0.15s var(--ease);
  }
  .step:hover { background: var(--accent-soft); }
  .step-badge {
    position: relative;
    width: 32px; height: 32px;
    margin: 0 auto 4px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--accent);
    background: var(--accent-soft);
  }
  .step-badge svg { width: 15px; height: 15px; }
  .step-num {
    position: absolute;
    top: -2px; right: -2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    display: grid; place-items: center;
  }
  .step h4 {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .step p { display: none; }
  .wf-arrow {
    align-self: center;
    color: #d0d3d9;
    flex: 0 0 auto;
    padding-bottom: 14px;
  }
  .wf-arrow svg { width: 12px; height: 12px; }

  /* —— 底区：导航 + 指引 —— */
  .body-row {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 240px;
    gap: 10px;
  }
  .panel {
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
    flex-shrink: 0;
  }
  .panel-head h3 {
    margin: 0;
    font-size: 12.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .panel-head h3 .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .panel-head span { font-size: 11px; color: var(--muted); }

  .cards {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    grid-auto-rows: minmax(0, 1fr);
    gap: 8px;
    align-content: stretch;
  }
  .card {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #fff;
    min-height: 0;
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
  }
  .card:hover {
    border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
    box-shadow: var(--shadow-md);
  }
  .card-icon {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: grid; place-items: center;
    color: var(--accent);
    background: var(--accent-soft);
    flex-shrink: 0;
  }
  .card-icon svg { width: 15px; height: 15px; }
  .card-body { min-width: 0; }
  .card-title {
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.25;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card p {
    margin: 3px 0 0;
    font-size: 11px;
    line-height: 1.35;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .guide {
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .guide-block {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 8px 10px;
    border-radius: 9px;
    background: #f5f7fa;
    border: 1px solid var(--line);
  }
  .guide-block.tips {
    background: #f0fdfa;
    border-color: rgba(15, 118, 110, 0.12);
  }
  .guide-block h4 {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-2);
    flex-shrink: 0;
  }
  .guide-block.tips h4 { color: #0f766e; }
  .guide-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 5px;
    overflow: hidden;
  }
  .guide-list li {
    position: relative;
    padding-left: 14px;
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--ink-2);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .guide-list li::before {
    content: "";
    position: absolute;
    left: 0; top: 6px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .guide-block.tips .guide-list li::before { background: #0f766e; }

  /* 旁注浮层 */
  .anno-layer {
    display: none;
    position: fixed;
    inset: var(--bar-h) 0 0 var(--sidebar-w);
    z-index: 30;
    background: rgba(15, 23, 42, 0.35);
    padding: 16px;
    overflow: auto;
  }
  body.show-anno .anno-layer { display: block; }
  .anno-card {
    max-width: 560px;
    margin: 0 auto;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 12px;
    padding: 14px 16px;
    color: #92400e;
    font-size: 12.5px;
    line-height: 1.55;
    box-shadow: var(--shadow-md);
  }
  .anno-card strong { display: block; margin-bottom: 6px; }
  .anno-card ul { margin: 0; padding-left: 18px; }

  @media (max-width: 1100px) {
    .hero { grid-template-columns: minmax(0, 1fr) 180px; }
    .body-row { grid-template-columns: minmax(0, 1fr) 200px; }
    .strip { grid-template-columns: 1fr; }
    .actions { justify-content: flex-start; }
  }
  @media (max-height: 780px) {
    .hero { padding: 10px 12px; }
    .hero h2 { font-size: 19px; }
    .desc { -webkit-line-clamp: 1; }
    .art-brief { -webkit-line-clamp: 2; }
  }
</style>
</head>
<body>
  <header class="proto-bar">
    <strong>租户端 · 模块总览</strong>
    <span class="tag">单屏高保真</span>
    <span class="muted">一屏看完 · 插画预留 · 旁注浮层</span>
    <button type="button" class="toggle" id="annoToggle" aria-pressed="false">设计旁注</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">ZT</div>
        <div>
          <div class="name">智途企业端</div>
          <div class="sub">模块总览</div>
        </div>
      </div>
      <p class="hint">一级菜单</p>
      <ul class="nav-list" id="nav"></ul>
    </aside>

    <main class="main">
      <div class="board" id="canvas"></div>
    </main>
  </div>

  <div class="anno-layer" id="annoLayer"></div>

<script>
const ICONS = {
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/><path d="m5.6 5.6 2.8 2.8"/><path d="m15.6 15.6 2.8 2.8"/><path d="m5.6 18.4 2.8-2.8"/><path d="m15.6 8.4 2.8-2.8"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>',

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function icon(name) {
  return ICONS[name] || ICONS.grid;
}

function renderAnno(mod) {
  return `
    <div class="anno-card">
      <strong>设计师旁注 · ${escapeHtml(mod.title)}</strong>
      <ul>
        <li>主文案：一句话定位；描述最多两行；边界一句话</li>
        <li>插画 metaphor：${escapeHtml(mod.illustration.metaphor)}</li>
        <li>必含：${escapeHtml(mod.illustration.must)}</li>
        <li>避免：${escapeHtml(mod.illustration.avoid)}</li>
        <li>构图：${escapeHtml(mod.illustration.aspect)}</li>
        <li>布局目标：整页一屏，无纵向滚动</li>
      </ul>
    </div>`;
}

function renderModule(mod) {
  document.documentElement.style.setProperty("--accent", mod.accent);

  const hasWf = !!mod.workflow;
  let workflowHtml = "";
  if (hasWf) {
    const parts = [];
    mod.workflow.forEach((s, i) => {
      parts.push(`
        <div class="step" title="${escapeHtml(s.desc)}">
          <div class="step-badge">
            ${icon(s.icon)}
            <span class="step-num">${i + 1}</span>
          </div>
          <h4>${escapeHtml(s.title)}</h4>
        </div>`);
      if (i < mod.workflow.length - 1) {
        parts.push(`<div class="wf-arrow" aria-hidden="true">${icon("arrow")}</div>`);
      }
    });
    workflowHtml = `
      <section class="workflow-panel">
        <div class="head">
          <h3><span class="dot"></span>工作流程</h3>
          <span>悬停步骤可看说明</span>
        </div>
        <div class="workflow">${parts.join("")}</div>
      </section>`;
  }

  return `
    <section class="hero">
      <div class="hero-main">
        <div class="hero-top">
          <span class="eyebrow">${icon("spark")} 模块总览</span>
          <div class="roles">
            ${mod.roles.map((r) => `<span class="role-chip">${escapeHtml(r)}</span>`).join("")}
          </div>
        </div>
        <h2>${escapeHtml(mod.title)}</h2>
        <p class="positioning">${escapeHtml(mod.positioning)}</p>
        <p class="desc" title="${escapeHtml(mod.description)}">${escapeHtml(mod.description)}</p>
        <div class="boundary">
          ${icon("shield")}
          <div><b>边界</b> · ${escapeHtml(mod.boundary)}</div>
        </div>
      </div>
      <div class="art" aria-label="插画预留占位" title="必含：${escapeHtml(mod.illustration.must)}｜避免：${escapeHtml(mod.illustration.avoid)}">
        <div>
          <div class="art-badge">Illustration</div>
          <div class="art-title">${escapeHtml(mod.illustration.metaphor)}</div>
          <p class="art-brief">${escapeHtml(mod.illustration.must)}</p>
        </div>
      </div>
    </section>

    <section class="strip">
      <div class="chain">
        <span class="chain-label">链路</span>
        <div class="chain-node">
          <div class="k">${escapeHtml(mod.chain.from.label)}</div>
          <div class="v" title="${escapeHtml(mod.chain.from.text)}">${escapeHtml(mod.chain.from.text)}</div>
        </div>
        <div class="chain-arrow">${icon("arrow")}</div>
        <div class="chain-node current">
          <div class="k">${escapeHtml(mod.chain.current.label)}</div>
          <div class="v" title="${escapeHtml(mod.chain.current.text)}">${escapeHtml(mod.chain.current.text)}</div>
        </div>
        <div class="chain-arrow">${icon("arrow")}</div>
        <div class="chain-node">
          <div class="k">${escapeHtml(mod.chain.to.label)}</div>
          <div class="v" title="${escapeHtml(mod.chain.to.text)}">${escapeHtml(mod.chain.to.text)}</div>
        </div>
      </div>
      <div class="actions">
        ${mod.quickActions
          .map(
            (a) =>
              `<span class="btn${a.primary ? " primary" : ""}">${
                a.primary ? icon("plus") : ""
              }${escapeHtml(a.title)}</span>`
          )
          .join("")}
      </div>
    </section>

    ${workflowHtml}

    <section class="body-row">
      <div class="panel">
        <div class="panel-head">
          <h3><span class="dot"></span>模块导航</h3>
          <span>${mod.cards.length} 个子模块</span>
        </div>
        <div class="cards">
          ${mod.cards
            .map(
              (c) => `
            <div class="card" title="${escapeHtml(c.desc)}">
              <div class="card-icon">${icon(c.icon)}</div>
              <div class="card-body">
                <div class="card-title">${escapeHtml(c.title)}</div>
                <p>${escapeHtml(c.desc)}</p>
              </div>
            </div>`
            )
            .join("")}
        </div>
      </div>
      <aside class="panel guide">
        <div class="panel-head">
          <h3><span class="dot"></span>上手指引</h3>
        </div>
        <div class="guide-block">
          <h4>开始前准备</h4>
          <ul class="guide-list">
            ${mod.prereq.map((t) => `<li title="${escapeHtml(t)}">${escapeHtml(t)}</li>`).join("")}
          </ul>
        </div>
        <div class="guide-block tips">
          <h4>使用提示</h4>
          <ul class="guide-list">
            ${mod.tips.map((t) => `<li title="${escapeHtml(t)}">${escapeHtml(t)}</li>`).join("")}
          </ul>
        </div>
      </aside>
    </section>
  `;
}

function init() {
  const nav = document.getElementById("nav");
  const canvas = document.getElementById("canvas");
  const annoLayer = document.getElementById("annoLayer");
  const annoToggle = document.getElementById("annoToggle");
  let active = MODULES[0].key;

  annoToggle.addEventListener("click", () => {
    const on = document.body.classList.toggle("show-anno");
    annoToggle.setAttribute("aria-pressed", String(on));
    annoToggle.textContent = on ? "关闭旁注" : "设计旁注";
  });
  annoLayer.addEventListener("click", (e) => {
    if (e.target === annoLayer) {
      document.body.classList.remove("show-anno");
      annoToggle.setAttribute("aria-pressed", "false");
      annoToggle.textContent = "设计旁注";
    }
  });

  function select(key) {
    active = key;
    const mod = MODULES.find((m) => m.key === key);
    canvas.className = "board" + (mod.workflow ? " has-workflow" : "");
    canvas.innerHTML = renderModule(mod);
    annoLayer.innerHTML = renderAnno(mod);
    [...nav.querySelectorAll("button")].forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.key === key);
    });
  }

  nav.innerHTML = MODULES.map(
    (m) => `
    <li>
      <button type="button" data-key="${m.key}" style="--accent:${m.accent}">
        <span class="nav-ico">${icon(m.navIcon)}</span>
        ${escapeHtml(m.title)}
      </button>
    </li>`
  ).join("");

  nav.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-key]");
    if (!btn) return;
    select(btn.dataset.key);
  });

  select(active);
}

init();
</script>
