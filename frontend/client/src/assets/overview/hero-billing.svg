<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="blDoc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#fdf3e6" /></linearGradient>
    <linearGradient id="blCoin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc879" /><stop offset="1" stop-color="#f08c00" /></linearGradient>
    <linearGradient id="blHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb454" /><stop offset="1" stop-color="#f08c00" /></linearGradient>
    <linearGradient id="blCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#fdf1e2" /></linearGradient>
  </defs>

  <!-- backdrop -->
  <g fill="#f6d6ac" opacity="0.5">
    <circle cx="70" cy="80" r="3" /><circle cx="96" cy="80" r="3" /><circle cx="70" cy="106" r="3" />
  </g>
  <ellipse cx="300" cy="316" rx="220" ry="20" fill="#000000" opacity="0.03" />

  <!-- tilted rate document (slight rotation) -->
  <g transform="rotate(-7 296 190)">
    <rect x="176" y="72" width="240" height="232" rx="16" fill="#f3ddba" opacity="0.6" transform="translate(10 10)" />
    <rect x="176" y="72" width="240" height="232" rx="16" fill="url(#blDoc)" stroke="#f4dcbb" stroke-width="1.5" />
    <path d="M176 88a16 16 0 0 1 16-16h208a16 16 0 0 1 16 16v18H176z" fill="url(#blHead)" />
    <rect x="196" y="82" width="96" height="10" rx="5" fill="#ffffff" opacity="0.9" />
    <!-- rate matrix -->
    <rect x="196" y="124" width="200" height="20" rx="5" fill="#fdeacf" />
    <rect x="204" y="130" width="60" height="8" rx="4" fill="#eaa542" />
    <rect x="320" y="130" width="66" height="8" rx="4" fill="#eaa542" />
    <g fill="#efd2a4"><rect x="204" y="156" width="90" height="7" rx="3.5" /><rect x="204" y="180" width="120" height="7" rx="3.5" /><rect x="204" y="204" width="76" height="7" rx="3.5" /><rect x="204" y="228" width="104" height="7" rx="3.5" /></g>
    <g fill="#f08c00"><rect x="332" y="154" width="54" height="10" rx="5" /><rect x="332" y="178" width="54" height="10" rx="5" opacity="0.8" /><rect x="332" y="202" width="54" height="10" rx="5" opacity="0.62" /><rect x="332" y="226" width="54" height="10" rx="5" opacity="0.46" /></g>
    <g stroke="#f6e0bf" stroke-width="1.4"><path d="M196 170h200M196 194h200M196 218h200" /></g>
    <!-- stamp -->
    <circle cx="356" cy="268" r="24" fill="none" stroke="#ff7a59" stroke-width="3.5" opacity="0.9" />
    <path d="M345 268l7 7 15-17" stroke="#ff7a59" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- coin stack -->
  <g>
    <ellipse cx="470" cy="286" rx="52" ry="16" fill="url(#blCoin)" />
    <rect x="418" y="258" width="104" height="28" fill="url(#blCoin)" /><ellipse cx="470" cy="258" rx="52" ry="16" fill="#ffcf85" />
    <rect x="418" y="234" width="104" height="24" fill="url(#blCoin)" /><ellipse cx="470" cy="234" rx="52" ry="16" fill="#ffd79a" />
    <ellipse cx="470" cy="212" rx="52" ry="16" fill="#ffcf85" />
    <path d="M470 200v22M462 208l8 4 8-4M462 216h16" stroke="#cc7600" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- floating card: total amount -->
  <g>
    <rect x="452" y="88" width="150" height="60" rx="14" fill="url(#blCard)" stroke="#f6e2c4" stroke-width="1.5" />
    <circle cx="482" cy="118" r="16" fill="url(#blCoin)" />
    <path d="M476 110l6 7 6-7M482 117v10M477 122h10" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="506" y="104" width="82" height="9" rx="4.5" fill="#f08c00" opacity="0.85" />
    <rect x="506" y="120" width="60" height="7" rx="3.5" fill="#f2d3a2" />
    <rect x="506" y="133" width="44" height="6" rx="3" fill="#f8e6cf" />
  </g>

  <!-- paper plane -->
  <path d="M566 62l40-16-16 40-8-16z" fill="#ffca80" />
  <path d="M566 62l24-8-8 16z" fill="#f08c00" />
</svg>
