<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="inFrame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#e8f6f8" /></linearGradient>
    <linearGradient id="inHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#43c6db" /><stop offset="1" stop-color="#1098ad" /></linearGradient>
    <linearGradient id="inChip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ccfe3" /><stop offset="1" stop-color="#0e8698" /></linearGradient>
  </defs>

  <g fill="#c6ebf1" opacity="0.5"><circle cx="66" cy="72" r="3" /><circle cx="92" cy="72" r="3" /><circle cx="66" cy="98" r="3" /></g>

  <!-- big dashboard screen -->
  <ellipse cx="316" cy="316" rx="240" ry="18" fill="#000000" opacity="0.04" />
  <rect x="96" y="70" width="440" height="222" rx="18" fill="url(#inFrame)" stroke="#d6eef2" stroke-width="1.5" />
  <path d="M96 88a18 18 0 0 1 18-18h404a18 18 0 0 1 18 18v14H96z" fill="url(#inHead)" />
  <circle cx="114" cy="86" r="3.6" fill="#ffffff" opacity="0.9" /><circle cx="128" cy="86" r="3.6" fill="#ffffff" opacity="0.6" /><circle cx="142" cy="86" r="3.6" fill="#ffffff" opacity="0.4" />
  <rect x="300" y="80" width="220" height="12" rx="6" fill="#ffffff" opacity="0.25" />

  <!-- KPI tiles (top row) -->
  <g>
    <rect x="114" y="116" width="92" height="46" rx="10" fill="#ffffff" stroke="#dcf0f3" stroke-width="1.2" />
    <rect x="124" y="126" width="40" height="9" rx="4.5" fill="#1098ad" opacity="0.85" /><rect x="124" y="142" width="56" height="6" rx="3" fill="#d7eef2" />
    <path d="M180 150l6-7 4 3 5-7" stroke="#0e8698" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>
  <g>
    <rect x="216" y="116" width="92" height="46" rx="10" fill="#ffffff" stroke="#dcf0f3" stroke-width="1.2" />
    <rect x="226" y="126" width="34" height="9" rx="4.5" fill="#43c6db" /><rect x="226" y="142" width="52" height="6" rx="3" fill="#d7eef2" />
    <circle cx="292" cy="139" r="10" fill="none" stroke="#d7f0f4" stroke-width="4" /><path d="M292 129a10 10 0 0 1 7 17" stroke="#1098ad" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- main line chart -->
  <rect x="114" y="172" width="194" height="102" rx="12" fill="#ffffff" stroke="#dcf0f3" stroke-width="1.2" />
  <path d="M128 210h166M128 236h166" stroke="#eaf6f8" stroke-width="1.4" />
  <path d="M128 258l30-30 26 12 34-40 28 18 34-26" stroke="#1098ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M128 258l30-30 26 12 34-40 28 18 34-26V262H128z" fill="#1098ad" opacity="0.08" />
  <circle cx="218" cy="192" r="4.5" fill="#ff7a59" />

  <!-- donut + bars column -->
  <g>
    <rect x="318" y="116" width="204" height="70" rx="12" fill="#ffffff" stroke="#dcf0f3" stroke-width="1.2" />
    <circle cx="352" cy="151" r="20" fill="none" stroke="#d7f0f4" stroke-width="9" />
    <path d="M352 131a20 20 0 0 1 16 32" stroke="url(#inChip)" stroke-width="9" fill="none" stroke-linecap="round" />
    <path d="M352 131a20 20 0 0 0-15 8" stroke="#7fd9e6" stroke-width="9" fill="none" stroke-linecap="round" />
    <g><rect x="392" y="140" width="50" height="7" rx="3.5" fill="#cbeef3" /><rect x="392" y="154" width="70" height="7" rx="3.5" fill="#e0f4f7" /><rect x="392" y="168" width="40" height="7" rx="3.5" fill="#e0f4f7" /></g>
  </g>
  <g>
    <rect x="318" y="196" width="204" height="78" rx="12" fill="#ffffff" stroke="#dcf0f3" stroke-width="1.2" />
    <g>
      <rect x="336" y="234" width="16" height="24" rx="3" fill="#7fd9e6" /><rect x="362" y="222" width="16" height="36" rx="3" fill="#1098ad" />
      <rect x="388" y="240" width="16" height="18" rx="3" fill="#7fd9e6" /><rect x="414" y="216" width="16" height="42" rx="3" fill="#1098ad" />
      <rect x="440" y="230" width="16" height="28" rx="3" fill="#7fd9e6" /><rect x="466" y="210" width="16" height="48" rx="3" fill="#1098ad" /><rect x="492" y="238" width="16" height="20" rx="3" fill="#7fd9e6" />
    </g>
  </g>

  <!-- floating magnifier -->
  <g>
    <rect x="470" y="220" width="80" height="80" rx="20" fill="#ffffff" stroke="#d6eef2" stroke-width="1.5" />
    <circle cx="504" cy="252" r="20" fill="none" stroke="url(#inChip)" stroke-width="6" />
    <path d="M520 268l18 18" stroke="#0e8698" stroke-width="8" stroke-linecap="round" />
    <path d="M494 252a10 10 0 0 1 10-10" stroke="#7fd9e6" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- paper plane -->
  <path d="M566 54l40-16-16 40-8-16z" fill="#6fd7e6" />
  <path d="M566 54l24-8-8 16z" fill="#1098ad" />
</svg>
