<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="apHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d86ff" /><stop offset="1" stop-color="#4263eb" /></linearGradient>
    <linearGradient id="apBadge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d92ff" /><stop offset="1" stop-color="#3a55d9" /></linearGradient>
    <linearGradient id="apCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#edf0fd" /></linearGradient>
  </defs>

  <!-- backdrop -->
  <g fill="#c8d2f8" opacity="0.5"><circle cx="70" cy="80" r="3" /><circle cx="96" cy="80" r="3" /><circle cx="70" cy="106" r="3" /></g>

  <!-- pipeline rail -->
  <path d="M112 250h416" stroke="#d5ddfb" stroke-width="4" stroke-linecap="round" />
  <path d="M112 250h416" stroke="#4263eb" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14" />

  <!-- stage nodes on rail -->
  <g>
    <circle cx="152" cy="250" r="16" fill="url(#apBadge)" /><path d="M145 250l5 5 9-11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="320" cy="250" r="16" fill="url(#apBadge)" /><path d="M313 250l5 5 9-11" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="488" cy="250" r="16" fill="#ffffff" stroke="#a9b6ff" stroke-width="3" /><circle cx="488" cy="250" r="5" fill="#a9b6ff" />
  </g>

  <!-- three document cards above stages -->
  <g>
    <ellipse cx="152" cy="196" rx="46" ry="8" fill="#1b2a4a" opacity="0.1" />
    <rect x="112" y="96" width="80" height="94" rx="12" fill="url(#apCard)" stroke="#e2e6fb" stroke-width="1.5" />
    <path d="M112 108a12 12 0 0 1 12-12h56a12 12 0 0 1 12 12v8H112z" fill="url(#apHead)" />
    <g fill="#ccd6fb"><rect x="126" y="128" width="52" height="6" rx="3" /><rect x="126" y="142" width="40" height="6" rx="3" /><rect x="126" y="156" width="48" height="6" rx="3" /><rect x="126" y="170" width="30" height="6" rx="3" /></g>
  </g>
  <g>
    <ellipse cx="320" cy="196" rx="46" ry="8" fill="#1b2a4a" opacity="0.1" />
    <rect x="280" y="86" width="80" height="104" rx="12" fill="url(#apCard)" stroke="#e2e6fb" stroke-width="1.5" />
    <path d="M280 98a12 12 0 0 1 12-12h56a12 12 0 0 1 12 12v8H280z" fill="url(#apHead)" />
    <g fill="#ccd6fb"><rect x="294" y="118" width="52" height="6" rx="3" /><rect x="294" y="132" width="40" height="6" rx="3" /></g>
    <circle cx="320" cy="160" r="18" fill="url(#apBadge)" /><path d="M311 160l6 6 11-13" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g>
    <ellipse cx="488" cy="196" rx="46" ry="8" fill="#1b2a4a" opacity="0.08" />
    <rect x="448" y="104" width="80" height="86" rx="12" fill="url(#apCard)" stroke="#e2e6fb" stroke-width="1.5" opacity="0.92" />
    <path d="M448 116a12 12 0 0 1 12-12h56a12 12 0 0 1 12 12v8H448z" fill="#aab6f2" />
    <g fill="#dbe2fc"><rect x="462" y="134" width="52" height="6" rx="3" /><rect x="462" y="148" width="40" height="6" rx="3" /><rect x="462" y="162" width="46" height="6" rx="3" /></g>
  </g>

  <!-- big approval seal (floating) -->
  <g>
    <rect x="446" y="66" width="120" height="80" rx="16" fill="url(#apCard)" stroke="#e2e6fb" stroke-width="1.5" />
    <circle cx="486" cy="106" r="24" fill="url(#apBadge)" />
    <circle cx="486" cy="106" r="24" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 5" opacity="0.55" />
    <path d="M475 106l7 7 16-18" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="518" y="94" width="42" height="8" rx="4" fill="#4263eb" opacity="0.8" />
    <rect x="518" y="110" width="30" height="7" rx="3.5" fill="#cdd6fb" />
  </g>

  <!-- floating card: pending -->
  <g>
    <rect x="64" y="196" width="118" height="52" rx="14" fill="url(#apCard)" stroke="#e2e6fb" stroke-width="1.5" />
    <rect x="78" y="210" width="24" height="24" rx="7" fill="url(#apBadge)" />
    <path d="M90 216v6l4 3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <rect x="112" y="210" width="56" height="9" rx="4.5" fill="#4263eb" opacity="0.8" />
    <rect x="112" y="225" width="38" height="7" rx="3.5" fill="#d3dcfb" />
  </g>

  <!-- paper plane -->
  <path d="M566 60l40-16-16 40-8-16z" fill="#93a5ff" />
  <path d="M566 60l24-8-8 16z" fill="#4263eb" />
</svg>
