<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <radialGradient id="opHub" cx="0.4" cy="0.35" r="0.75"><stop offset="0" stop-color="#7fb0ff" /><stop offset="1" stop-color="#3f7cff" /></radialGradient>
    <linearGradient id="opBox" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ea0ff" /><stop offset="1" stop-color="#3f7cff" /></linearGradient>
    <linearGradient id="opBoxB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc0ff" /><stop offset="1" stop-color="#5b8dff" /></linearGradient>
    <linearGradient id="opCard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#f2f6ff" /></linearGradient>
    <linearGradient id="opHead" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ea0ff" /><stop offset="1" stop-color="#3f7cff" /></linearGradient>
  </defs>

  <g fill="#c9d8f7" opacity="0.5"><circle cx="66" cy="70" r="3" /><circle cx="92" cy="70" r="3" /><circle cx="66" cy="96" r="3" /></g>

  <!-- route curve (dispatch -> destination) -->
  <path d="M104 276C196 196 250 300 360 224S520 150 556 178" stroke="#cdddff" stroke-width="9" stroke-linecap="round" />
  <path d="M104 276C196 196 250 300 360 224S520 150 556 178" stroke="#3f7cff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 13" />
  <g fill="#3f7cff"><circle cx="230" cy="228" r="4.5" /><circle cx="446" cy="196" r="4.5" /></g>

  <!-- dispatch center hub -->
  <g>
    <circle cx="104" cy="276" r="40" fill="#3f7cff" opacity="0.08" />
    <circle cx="104" cy="276" r="28" fill="#3f7cff" opacity="0.14" />
    <circle cx="104" cy="276" r="18" fill="url(#opHub)" />
    <circle cx="104" cy="276" r="6.5" fill="#ffffff" />
    <g stroke="#8fb6ff" stroke-width="2"><path d="M104 248v-12M132 276h12M104 304v12M76 276H64" /></g>
    <circle cx="104" cy="230" r="4" fill="#5b8dff" /><circle cx="150" cy="276" r="4" fill="#5b8dff" /><circle cx="104" cy="322" r="4" fill="#5b8dff" />
  </g>

  <!-- cargo consolidation / loading on pallet -->
  <g>
    <ellipse cx="372" cy="266" rx="72" ry="12" fill="#1b2a4a" opacity="0.1" />
    <rect x="316" y="256" width="112" height="10" rx="3" fill="#c3d3f2" />
    <rect x="316" y="262" width="112" height="4" fill="#a9c0ec" />
    <!-- bottom layer -->
    <rect x="324" y="222" width="46" height="34" rx="5" fill="url(#opBox)" />
    <path d="M324 234h46" stroke="#2f63e0" stroke-width="3" />
    <rect x="374" y="222" width="46" height="34" rx="5" fill="url(#opBoxB)" />
    <path d="M374 234h46" stroke="#3f7cff" stroke-width="3" />
    <!-- top layer -->
    <rect x="349" y="190" width="46" height="34" rx="5" fill="url(#opBox)" />
    <path d="M349 202h46M372 190v34" stroke="#2f63e0" stroke-width="2.6" />
    <!-- loading up badge -->
    <circle cx="410" cy="192" r="15" fill="#ff7a59" />
    <path d="M410 199v-14M403 192l7-7 7 7" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- destination pin -->
  <g>
    <ellipse cx="556" cy="182" rx="13" ry="5" fill="#1b2a4a" opacity="0.12" />
    <path d="M556 138c-13 0-23 10-23 23 0 16 23 38 23 38s23-22 23-38c0-13-10-23-23-23z" fill="#3f7cff" />
    <circle cx="556" cy="161" r="8" fill="#ffffff" />
  </g>

  <!-- floating console: dispatch workbench -->
  <g>
    <rect x="360" y="60" width="176" height="72" rx="14" fill="url(#opCard)" stroke="#e4ebfa" stroke-width="1.5" />
    <path d="M360 74a14 14 0 0 1 14-14h148a14 14 0 0 1 14 14v8H360z" fill="url(#opHead)" />
    <rect x="372" y="67" width="60" height="8" rx="4" fill="#ffffff" opacity="0.9" />
    <path d="M374 116c14-16 26 4 40-8s26-12 40-16" stroke="#3f7cff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 8" fill="none" />
    <circle cx="374" cy="116" r="4" fill="#ff7a59" />
    <rect x="474" y="98" width="50" height="20" rx="10" fill="#3f7cff" />
    <path d="M486 108h18M498 103l6 5-6 5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- paper plane -->
  <path d="M566 300l22-30-2 37-9-13z" fill="#8fb6ff" opacity="0.9" />
</svg>
