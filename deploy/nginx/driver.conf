# ============================================================
# 智途(ZhiTu) 驾驶员 H5 端 Nginx 配置
# 域名: driver.zhitu.me
# 证书: 阿里云 SSL 证书
#
# 注意：H5 端为移动端，使用了 viewport-fit=cover + safe-area，
#       因此 client_max_body_size 留出空间给「装/卸车照片 + 回单」上传。
# ============================================================

server {
    listen 80;
    server_name driver.zhitu.me;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name driver.zhitu.me;

    ssl_certificate     /etc/nginx/ssl/driver.zhitu.me.pem;
    ssl_certificate_key /etc/nginx/ssl/driver.zhitu.me.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 移动端：照片上传（装车/卸车/回单），单次最多 9 张，按 5MB/张估算
    client_max_body_size 50m;

    root /usr/share/nginx/driver;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 驾驶员端业务接口（与 client 解耦的独立路由树）
    location /api/driver/ {
        proxy_pass http://backend:8000/api/driver/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 弱网移动端：放宽超时，避免列表/详情接口被中断
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 验证码、文件上传等开放接口
    location /api/open/ {
        proxy_pass http://backend:8000/api/open/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件（头像 / 装卸车照片 / 回单图）由 FastAPI 挂载在根 /uploads
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 单页应用 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
