# ============================================================
# 智途(ZhiTu) 企业客户端 Nginx 配置
# 域名: wuliu.zhitu.me
# 证书: 阿里云 SSL 证书
# ============================================================

server {
    listen 80;
    server_name wuliu.zhitu.me;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name wuliu.zhitu.me;

    ssl_certificate     /etc/nginx/ssl/wuliu.zhitu.me.pem;
    ssl_certificate_key /etc/nginx/ssl/wuliu.zhitu.me.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/client;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/client/ {
        proxy_pass http://backend:8000/api/client/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/console/ {
        proxy_pass http://backend:8000/api/console/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
