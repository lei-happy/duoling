# ============================================================
# 智途(ZhiTu) 企业客户端 Nginx 配置
# 域名: wuliu.zhitu.me
# ============================================================

server {
    listen 80;
    server_name wuliu.zhitu.me;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name wuliu.zhitu.me;

    # SSL 证书
    ssl_certificate     /etc/letsencrypt/live/zhitu.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhitu.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/client;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源长期缓存
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理（客户端接口）
    location /api/client/ {
        proxy_pass http://backend:8000/api/client/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 反向代理（管理后台接口 - 租户管理员可能需要）
    location /api/console/ {
        proxy_pass http://backend:8000/api/console/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }
}
