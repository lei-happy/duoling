# ============================================================
# 智途(ZhiTu) 开放平台数据面 Nginx 配置
# 域名: api.zhitu.me
# 反代目标: openapi 容器（app.open_main:app，独立进程，避免与业务 API 抢资源）
# 承载: /openapi/v1（对外 REST）、/mcp（远程 MCP，Streamable HTTP / SSE）
# 证书: 阿里云 SSL 证书
# ============================================================

server {
    listen 80;
    server_name api.zhitu.me;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.zhitu.me;

    ssl_certificate     /etc/nginx/ssl/api.zhitu.me.pem;
    ssl_certificate_key /etc/nginx/ssl/api.zhitu.me.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ---- 远程 MCP：Streamable HTTP / SSE，需关闭缓冲并放长超时 ----
    location /mcp/ {
        proxy_pass http://openapi:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        # SSE 流式返回：关闭缓冲与分块缓存，逐事件下发
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # ---- 对外 REST 及其余数据面路由 ----
    location / {
        proxy_pass http://openapi:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
