# ============================================================
# 智途(ZhiTu) Docker Compose - 生产环境
# MySQL 使用宿主机已安装的实例，不在 Docker 中运行
# ============================================================

services:
  # ---- Redis 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: zhitu-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- 后端 API 服务 ----
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: zhitu-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DB_SUFFIX=
      - PLATFORM_DB_HOST=host.docker.internal
      - PLATFORM_DB_PORT=3306
      - PLATFORM_DB_USER=${DB_USER:-root}
      - PLATFORM_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - PLATFORM_DB_NAME=zt_platform
      - TENANT_DB_HOST=host.docker.internal
      - TENANT_DB_PORT=3306
      - TENANT_DB_USER=${DB_USER:-root}
      - TENANT_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - TENANT_DB_PREFIX=zt_biz_
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - CORS_ORIGINS=${CORS_ORIGINS:-["https://www.zhitu.me","https://console.zhitu.me","https://wuliu.zhitu.me"]}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID:-}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET:-}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME:-速通互联验证码}
      - ALIYUN_SMS_ENABLED=${ALIYUN_SMS_ENABLED:-true}
      - LOG_LEVEL=INFO
      - LOG_DIR=logs
    volumes:
      - backend_logs:/app/logs
      # 上传图片落盘到宿主机，便于 XFTP/备份；与 app.main 中 /app/uploads 一致
      - /opt/zhitu/data/uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    # Worker 数：与 CPU 核数相近即可（4 核机默认 4）；可在 .env 中设 UVICORN_WORKERS 覆盖
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${UVICORN_WORKERS:-4}"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---- Nginx 反向代理 + 静态文件服务 ----
  nginx:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.nginx
    container_name: zhitu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/zhitu/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend

volumes:
  redis_data:
    driver: local
  backend_logs:
    driver: local
