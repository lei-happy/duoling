# ============================================================
# 智途(ZhiTu) Docker Compose - 生产环境
# MySQL 使用宿主机已安装的实例，不在 Docker 中运行
# ============================================================

services:
  # ---- Redis 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: zhitu-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- 后端 API 服务 ----
  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: zhitu-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DB_SUFFIX=
      - PLATFORM_DB_HOST=host.docker.internal
      - PLATFORM_DB_PORT=3306
      - PLATFORM_DB_USER=${DB_USER:-root}
      - PLATFORM_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - PLATFORM_DB_NAME=zt_platform
      - TENANT_DB_HOST=host.docker.internal
      - TENANT_DB_PORT=3306
      - TENANT_DB_USER=${DB_USER:-root}
      - TENANT_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - TENANT_DB_PREFIX=zt_biz_
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - CORS_ORIGINS=${CORS_ORIGINS:-["https://www.zhitu.me","https://console.zhitu.me","https://wuliu.zhitu.me","https://driver.zhitu.me"]}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID:-}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET:-}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME:-速通互联验证码}
      - ALIYUN_SMS_ENABLED=${ALIYUN_SMS_ENABLED:-true}
      # 高德 Web 服务 Key（测距、驾车路径等；与前端 VITE_MAP_KEY 不是同一套）
      - AMAP_WEB_SERVICE_KEY=${AMAP_WEB_SERVICE_KEY:-}
      - LOG_LEVEL=INFO
      - LOG_DIR=logs
      - DOC_ROOT=/app/docs
      - PROTO_ROOT=/app/prototypes
      # 开放平台数据面公网地址：租户端「复制 MCP 配置」生成的 url 以此为准
      - OPEN_PLATFORM_BASE_URL=${OPEN_PLATFORM_BASE_URL:-https://api.zhitu.me}
      # 计费引擎 worker 默认在 API 进程内不启动；
      # 由独立的 backend-worker 容器运行，避免 4 个 uvicorn 进程重复扫表。
      - FREIGHT_CALC_WORKER_ENABLED=0
    volumes:
      - backend_logs:/app/logs
      # 上传图片落盘到宿主机，便于 XFTP/备份；与 app.main 中 /app/uploads 一致
      - /opt/zhitu/data/uploads:/app/uploads
      # platform_sync 凭证目录（含 .env.prod，存放 console 同步账号）
      # 挂宿主机目录而非打镜像，便于改凭证无需 rebuild
      # 仓库内已有 .env.example 入库；.env.prod 由 xftp 单独上传到宿主机此目录
      - /opt/zhitu/backend/scripts/platform_sync/envs:/app/scripts/platform_sync/envs:ro
    depends_on:
      redis:
        condition: service_healthy
    # Worker 数：与 CPU 核数相近即可（4 核机默认 4）；可在 .env 中设 UVICORN_WORKERS 覆盖
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${UVICORN_WORKERS:-4}"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---- 开放平台数据面服务（独立进程） ----
  # 承载对外 REST（/openapi/v1）与远程 MCP（/mcp），与 backend 共用同一镜像，
  # 但启动 app.open_main:app，单独一批 uvicorn worker，避免对外调用与内部业务抢资源。
  # 仅内网暴露 8100，由 nginx 的 api.zhitu.me 反代到此服务。
  openapi:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: zhitu-openapi
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_HOST=0.0.0.0
      - APP_PORT=8100
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - DB_SUFFIX=
      - PLATFORM_DB_HOST=host.docker.internal
      - PLATFORM_DB_PORT=3306
      - PLATFORM_DB_USER=${DB_USER:-root}
      - PLATFORM_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - PLATFORM_DB_NAME=zt_platform
      - TENANT_DB_HOST=host.docker.internal
      - TENANT_DB_PORT=3306
      - TENANT_DB_USER=${DB_USER:-root}
      - TENANT_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - TENANT_DB_PREFIX=zt_biz_
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      # 数据面公网地址：需与 nginx api.zhitu.me 域名一致
      - OPEN_PLATFORM_BASE_URL=${OPEN_PLATFORM_BASE_URL:-https://api.zhitu.me}
      # 单凭证每分钟调用上限、签名时间戳窗口（按需在 .env 覆盖）
      - OPEN_RATE_LIMIT_PER_MIN=${OPEN_RATE_LIMIT_PER_MIN:-600}
      - OPEN_TIMESTAMP_WINDOW_SEC=${OPEN_TIMESTAMP_WINDOW_SEC:-300}
      - LOG_LEVEL=INFO
      - LOG_DIR=logs
      # 数据面不跑计费/证照 worker
      - FREIGHT_CALC_WORKER_ENABLED=0
    volumes:
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - app.open_main:app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --workers
      - "${OPENAPI_WORKERS:-2}"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8100/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---- 计费引擎 Worker（独立进程） ----
  # 与 backend (uvicorn) 共用同一镜像、同一份环境变量，
  # 但启动命令是 python -m app.workers.freight_calc_main。
  # 单实例即可：claim_pending 走「先 SELECT pending → UPDATE→running」抢占，
  # 当前 1000 企业 + 几千单/天的体量单实例完全够用；
  # 未来运单量翻 10 倍以上再考虑横向扩多实例（worker 内已具备
  # 行级抢占语义，多实例只会出现极小概率的重复执行，不影响一致性）。
  backend-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: zhitu-backend-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - DB_SUFFIX=
      - PLATFORM_DB_HOST=host.docker.internal
      - PLATFORM_DB_PORT=3306
      - PLATFORM_DB_USER=${DB_USER:-root}
      - PLATFORM_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - PLATFORM_DB_NAME=zt_platform
      - TENANT_DB_HOST=host.docker.internal
      - TENANT_DB_PORT=3306
      - TENANT_DB_USER=${DB_USER:-root}
      - TENANT_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - TENANT_DB_PREFIX=zt_biz_
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - LOG_LEVEL=INFO
      - LOG_DIR=logs
      # worker 容器强制启用计费引擎 scheduler
      - FREIGHT_CALC_WORKER_ENABLED=1
      # worker 调度参数（按需在 .env 覆盖）
      - FREIGHT_CALC_WORKER_INTERVAL=${FREIGHT_CALC_WORKER_INTERVAL:-5}
      - FREIGHT_CALC_WORKER_BATCH=${FREIGHT_CALC_WORKER_BATCH:-20}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command:
      - python
      - -m
      - app.workers.freight_calc_main
    # worker 没有 HTTP 端口；进程崩溃由 restart: unless-stopped 自动拉起，
    # 这里不再单独配 healthcheck（python:slim 默认不带 ps，避免镜像膨胀）。

  # ---- 能源同步 Worker（独立进程） ----
  # 扫 biz_energy_sync_task，并在每日 01:10 做余额快照与成本归集。
  backend-energy-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: zhitu-backend-energy-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - DB_SUFFIX=
      - PLATFORM_DB_HOST=host.docker.internal
      - PLATFORM_DB_PORT=3306
      - PLATFORM_DB_USER=${DB_USER:-root}
      - PLATFORM_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - PLATFORM_DB_NAME=zt_platform
      - TENANT_DB_HOST=host.docker.internal
      - TENANT_DB_PORT=3306
      - TENANT_DB_USER=${DB_USER:-root}
      - TENANT_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - TENANT_DB_PREFIX=zt_biz_
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - LOG_LEVEL=INFO
      - LOG_DIR=logs
      - ENERGY_SYNC_WORKER_ENABLED=1
      - ENERGY_SYNC_WORKER_INTERVAL=${ENERGY_SYNC_WORKER_INTERVAL:-30}
      - ENERGY_SYNC_WORKER_BATCH=${ENERGY_SYNC_WORKER_BATCH:-10}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command:
      - python
      - -m
      - app.workers.energy_sync_main

  # ---- 证照监控 Worker（独立进程） ----
  # 运力宝核心：周期扫描各租户运力资质到期字段，生成 biz_compliance_alert 预警。
  # 与 backend 共用同一镜像、同一份环境变量，启动命令是
  # python -m app.workers.compliance_alert_main。
  # 到期是「天」级变化，默认 1 小时扫一轮，独立进程避免拖累 API 性能。
  backend-compliance-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: zhitu-backend-compliance-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - DB_SUFFIX=
      - PLATFORM_DB_HOST=host.docker.internal
      - PLATFORM_DB_PORT=3306
      - PLATFORM_DB_USER=${DB_USER:-root}
      - PLATFORM_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - PLATFORM_DB_NAME=zt_platform
      - TENANT_DB_HOST=host.docker.internal
      - TENANT_DB_PORT=3306
      - TENANT_DB_USER=${DB_USER:-root}
      - TENANT_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - TENANT_DB_PREFIX=zt_biz_
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - LOG_LEVEL=INFO
      - LOG_DIR=logs
      # worker 容器强制启用证照监控 scheduler
      - COMPLIANCE_WORKER_ENABLED=1
      # 扫描参数（按需在 .env 覆盖）
      - COMPLIANCE_WORKER_INTERVAL=${COMPLIANCE_WORKER_INTERVAL:-3600}
      - COMPLIANCE_ALERT_HORIZON_DAYS=${COMPLIANCE_ALERT_HORIZON_DAYS:-60}
      - COMPLIANCE_ALERT_CRITICAL_DAYS=${COMPLIANCE_ALERT_CRITICAL_DAYS:-7}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command:
      - python
      - -m
      - app.workers.compliance_alert_main

  # ---- 任务预警 Worker（调度工作台阶段预警） ----
  # 周期扫描各租户执行中的任务单，按阈值规则生成 biz_task_alert 预警。
  # 与 backend 共用同一镜像、同一份环境变量，启动命令是
  # python -m app.workers.task_alert_main。
  # 与证照监控不同，任务预警是「分钟」级变化，调度员盯着看板决策，默认 180s 一轮。
  backend-task-alert-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: zhitu-backend-task-alert-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_SECRET_KEY=${APP_SECRET_KEY:-change-me-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - DB_SUFFIX=
      - PLATFORM_DB_HOST=host.docker.internal
      - PLATFORM_DB_PORT=3306
      - PLATFORM_DB_USER=${DB_USER:-root}
      - PLATFORM_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - PLATFORM_DB_NAME=zt_platform
      - TENANT_DB_HOST=host.docker.internal
      - TENANT_DB_PORT=3306
      - TENANT_DB_USER=${DB_USER:-root}
      - TENANT_DB_PASSWORD=${DB_PASSWORD:-zhitu2026}
      - TENANT_DB_PREFIX=zt_biz_
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - LOG_LEVEL=INFO
      - LOG_DIR=logs
      # worker 容器强制启用任务预警 scheduler
      - TASK_ALERT_WORKER_ENABLED=1
      - TASK_ALERT_WORKER_INTERVAL=${TASK_ALERT_WORKER_INTERVAL:-180}
    volumes:
      - backend_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    command:
      - python
      - -m
      - app.workers.task_alert_main

  # ---- Nginx 反向代理 + 静态文件服务 ----
  nginx:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.nginx
    container_name: zhitu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/zhitu/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - openapi

volumes:
  redis_data:
    driver: local
  backend_logs:
    driver: local
