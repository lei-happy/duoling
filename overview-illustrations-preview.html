<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>总览页 Hero 插画预览（16:9）</title>
    <style>
      :root {
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      body {
        margin: 0;
        padding: 32px;
        background: #f4f6fb;
        color: #1f2733;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      p.sub {
        margin: 0 0 24px;
        color: #66707e;
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
        gap: 20px;
      }
      /* 复刻 overview-hero.vue 的最终样式 */
      .hero {
        position: relative;
        display: flex;
        align-items: center;
        gap: 24px;
        min-height: 232px;
        padding: 28px 28px 28px 32px;
        border-radius: 14px;
        overflow: hidden;
        background: linear-gradient(
          118deg,
          color-mix(in srgb, var(--accent) 20%, #ffffff) 0%,
          color-mix(in srgb, var(--accent) 8%, #ffffff) 40%,
          #ffffff 100%
        );
        border: 1px solid color-mix(in srgb, var(--accent) 16%, #e6e9f0);
      }
      .hero__text {
        flex: 1 1 auto;
        min-width: 0;
      }
      .eyebrow {
        display: inline-block;
        font-size: 12px;
        line-height: 20px;
        padding: 0 10px;
        border-radius: 10px;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 14%, #ffffff);
        margin-bottom: 12px;
      }
      .title {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 600;
      }
      .desc {
        margin: 0;
        font-size: 13.5px;
        line-height: 1.7;
        color: #5b6472;
        max-width: 460px;
      }
      .art {
        flex: 0 0 auto;
        align-self: center;
        width: 48%;
        max-width: 400px;
        display: flex;
        justify-content: flex-end;
      }
      .art img {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>总览页 Hero 插画预览（16:9 · 已复刻 overview-hero 样式）</h1>
    <p class="sub">
      背景=模块主题色渐变过渡，无左侧边框，插画 16:9 右置。可删除本预览文件
      overview-illustrations-preview.html。
    </p>
    <div class="grid" id="grid"></div>

    <script>
      const base = 'frontend/client/src/assets/overview/';
      const modules = [
        { key: 'operation', title: '运营调度', accent: '#3f7cff', desc: '运单受理·配载建单·派车调度·在途监控·回单签收 的作业中枢' },
        { key: 'capacity', title: '运力中心', accent: '#7048e8', desc: '统一纳管自有/承运商/社会运力，维护车辆司机档案与证照合规' },
        { key: 'partner', title: '客商中心', accent: '#e14b8a', desc: '集中管理客户、承运商、供应商与经销商门店档案与合作关系' },
        { key: 'billing', title: '计费中心', accent: '#f08c00', desc: '维护运价合同、成本政策与费用模板，收入成本自动核算' },
        { key: 'approval', title: '审批中心', accent: '#4263eb', desc: '集中处理各业务审批流转，保障关键操作合规、可追溯' },
        { key: 'finance', title: '财务结算', accent: '#099268', desc: '围绕应收应付、对账、发票与利润，完成资金闭环' },
        { key: 'insight', title: '数据洞察', accent: '#1098ad', desc: '汇聚运营、运力与财务数据，驾驶舱/看板/报表/预测' },
        { key: 'ecosystem', title: '服务平台', accent: '#e8590c', desc: '连接货源、运力与增值服务，对外拓展合作与资源交易' },
        { key: 'log-center', title: '日志中心', accent: '#495057', desc: '记录系统操作与登录行为，支撑安全审计与合规检查' },
        { key: 'enterprise', title: '企业配置', accent: '#5f3dc4', desc: '管理组织架构、员工角色权限、经营主体与系统设置' }
      ];
      document.getElementById('grid').innerHTML = modules
        .map(
          (m) => `
        <div class="hero" style="--accent:${m.accent}">
          <div class="hero__text">
            <span class="eyebrow">模块总览</span>
            <h2 class="title">${m.title}</h2>
            <p class="desc">${m.desc}</p>
          </div>
          <div class="art"><img src="${base}hero-${m.key}.svg" alt="${m.title}" /></div>
        </div>`
        )
        .join('');
    </script>
  </body>
</html>
